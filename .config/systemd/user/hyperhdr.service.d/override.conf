[Service]
ExecStartPre=/bin/sh -c 'until ping -c1 -W1 192.168.30.103 >/dev/null 2>&1; do sleep 1; done'
ExecStartPost=/bin/sh -c 'sleep 3; curl -sS -m3 -X POST -d "{\"command\":\"componentstate\",\"componentstate\":{\"component\":\"LEDDEVICE\",\"state\":true}}" http://localhost:8090/json-rpc'
ExecStop=/usr/bin/curl -sS -m3 -X POST -d "{\"on\":false}" http://192.168.30.103/json/state
